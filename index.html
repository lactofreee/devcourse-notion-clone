<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notion-Clone</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/editor.css" />
    <link rel="stylesheet" href="./styles/sideBar.css" />
    <link rel="stylesheet" href="./styles/breadCrums.css" />
  </head>
  <body class="screen">
    <!-- 사이드바 -->
    <aside class="screen__sidebar" id="sidebar">
      <!-- 사용자 -->
      <div class="sidebar__pageTitle" id="sidebar__pageTitle">
        <div class="sidebar__titleContainer">
          <p class="space_name">🐭 도시쥐와 시골쥐</p>
          <div class="red sidebar__iconWrap">
            <button class="sideBar__button" id="sideBar__hideButton">
              <img
                src="./src/asset/sideBar-hide.svg"
                alt="sideBar-hide"
                class="sidebar__icon"
              />
            </button>
            <button
              id="sidebar__createDocument--button"
              class="sideBar__button"
            >
              <img
                src="./src/asset/edit.svg"
                alt="edit_btn"
                class="sidebar__icon"
              />
            </button>
          </div>
        </div>
      </div>
      <!-- 목록 리스트 -->
      <nav id="sidebar__menuWrapper" class="sidebar__menuWrapper">
        <!-- <a class="document-content" href="/documents">랜딩 페이지</a> -->
        <ul id="document-list" class="document-list"></ul>
      </nav>
    </aside>
    <!-- 햄버거 아이콘 -->
    <div class="hamburger__wrap">
      <button
        class="hamburger__icon breadCrumbs__hamburger--hidden"
        id="sideBar__hamburger"
      >
        <img
          src="./src/asset/menu-burger.svg"
          alt="sidebar-button"
          class="sidebar__icon"
        />
      </button>
    </div>

    <!-- 메인 -->
    <main class="screen__pageView" id="mainSection">
      <header class="pageView__breadCrumbs">
        <p id="breadCrumb" class="breadCrumb">🐭 도시쥐와 시골쥐의 Notion</p>
        <button class="sideBar__button" id="trashIcon">
          <img src="./src/asset/trash-can.svg" class="sidebar__icon" />
        </button>
      </header>
      <section class="editor">
        <div id="editor__body" class="editor__body">
          <div id="editor__body--title" class="editor__title">
            <input
              type="text"
              id="editor__title-input"
              value="🧀 도시쥐와 시골쥐의 space"
            />
          </div>
          <div id="editor__body--content">
            <textarea id="editor__content-input" class="editor_content">
1. side-bar 숨기기
좌상단의 space-name에 hover할 때 side-bar를 숨길 수 있는 버튼이 표시됩니다. 클릭하면 editor 영역을 확장하여 전체 보기를 제공합니다.

2. 새로운 document 생성
좌상단의 생성 버튼은 root document를, docment-list에서 hover했을 때 나타나는 버튼은 해당 document의 하위 document를 생성합니다.

3. breadcrumb 표시
editor 영역에 표시된 document path를 최상위 document / 상위 document / 현재 document 순으로 표시합니다.

4. document 삭제
tool-bar 내부의 삭제 버튼을 클릭하면 현재 editor 화면에 표시된 document가 삭제됩니다.</textarea
            >
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/components/Sidebar.js"></script>
  </body>
</html>
